name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: viralcut-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities ?? {})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,via:v.via.map(x => typeof x === "string" ? x : {title:x.title,url:x.url,range:x.range}),fixAvailable:v.fixAvailable}))'
      - name: Check worker JavaScript syntax
        run: node --check workers/live-capture.mjs && node --check workers/process-windows.mjs && node --check workers/window-state.mjs
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Build application
        run: npm run build
